<app-navbar></app-navbar>
<!-- Gesamtcontainer: Zentriert den Inhalt und gibt oben/unten Abstand -->
<div class="container mx-auto my-16">

    <!-- alert -->
    <div *ngIf="isSuccess" class="p-5 my-3 bg-teal-100 text-teal-900">
        {{successMessage}}
    </div>

    <!-- Zwei-Spalten-Grid mit Abstand zwischen den Spalten -->
    <div class="grid grid-cols-2 gap-5">

        <!-- Linke Spalte: Darstellung einer gespeicherten Website -->
        <div class="shadow-lg border-2 border-gray-900">
            <!-- Bild der Website (hier: GoDaddy) -->
            <img [src]="siteImgURL" alt="">

            <!-- Website-Name, groß und fett -->
            <h3 class="text-xl font-bold p-3"> {{siteName}} </h3>

            <!-- URL-Anzeige in einem kleinen Grid -->
            <div class="grid grid-cols-3 gap-3 my-1 p-3">
                <!-- Die URL nimmt 2 von 3 Spalten ein -->
                <div class="col-span-2 px-3 bg-blue-200 text-blue-800 rounded-lg text-sm">
                    {{siteURL}}
                </div>
            </div>
        </div>

        <!-- Rechte Spalte: Formular zum Hinzufügen eines neuen Benutzers -->
        <div class="px-20 py-10 my-10 border-4 border-gray-900">
            <!-- Überschrift + Beschreibung des Formulars -->
            <h2 class="text-3xl text-center">{{formState}} User & Password</h2>
            <p class="text-center">You can {{formState}} user & password from below form</p>

            <!-- Formular zur Eingabe von E-Mail, Benutzername und Passwort -->
            <form #f="ngForm" (ngSubmit)="onSubmit(f.value)">
                <!-- Eingabefeld für E-Mail -->
                <div class="flex flex-col">
                    <label class="text-lg font-medium mb-2">Email</label>
                    <input [(ngModel)]="email" type="email" name="email"
                        class="border-2 border-gray-900 p-2 rounded-lg">
                </div>

                <!-- Eingabefeld für Benutzername -->
                <div class="flex flex-col">
                    <label class="text-lg font-medium mb-2">Username</label>
                    <input [(ngModel)]="username" type="text" name="username"
                        class="border-2 border-gray-900 p-2 rounded-lg">
                </div>

                <!-- Eingabefeld für Passwort -->
                <div class="flex flex-col">
                    <label class="text-lg font-medium mb-2">Password</label>
                    <input [(ngModel)]="password" type="password" name="password"
                        class="border-2 border-gray-900 p-2 rounded-lg">
                </div>

                <!-- Button zum Abschicken des Formulars -->
                <button class="mt-10 mx-0.5 px-5 py-3 text-sm bg-gray-900 text-white shadow rounded-md">
                    {{formState}} Password
                </button>
            </form>
        </div>
    </div>

    <!-- Tabelle zur Darstellung aller gespeicherten Zugangsdaten -->
    <div class="grid grid-cols-1 mt-10">
        <table class="border-2 border-gray-900 w-full">
            <thead>
                <!-- Tabellenkopf mit Spaltenüberschriften -->
                <tr class="bg-gray-200 h-14 text-left">
                    <th class="border-2 border-gray-900 p-3">Email</th>
                    <th class="border-2 border-gray-900 p-3">Username</th>
                    <th class="border-2 border-gray-900 p-3">Password</th>
                    <th class="border-2 border-gray-900 p-3">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr class="h-14" *ngFor="let password of passwordList; let i = index">
                    <td class="border-2 border-gray-900 p-3"> {{password.email}} </td>
                    <td class="border-2 border-gray-900 p-3"> {{password.username}} </td>
                    <td class="border-2 border-gray-900 p-3"> {{password.password}}
                        <button (click)="onDecrypt(password.password, i)"
                            class="mx-0.5 px-5 px-1 text-sm bg-red-500 text-white shadow rounded-md">
                            Decrypt
                        </button>
                    </td>
                    <!-- Button zum Bearbeiten -->
                    <button (click)="editPassword(password.email, password.username, password.password, password.id)"
                        class="mx-0.5 px-5 py-3 text-sm bg-gray-900 text-white shadow rounded-md">
                        Edit
                    </button>
                    <!-- Button zum Löschen -->
                    <button (click)="deletePassword(password.id)"
                        class="mx-0.5 px-5 py-3 text-sm border-2 border-gray-900 text-gray-900 shadow rounded-md">
                        Delete
                    </button>
                </tr>
            </tbody>
        </table>
    </div>
</div>
