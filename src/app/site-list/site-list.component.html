<app-navbar></app-navbar>

<main class="page-shell sites-page">
  <section class="hero-row">
    <div>
      <p class="eyebrow">Vault overview</p>
      <h1 class="page-title">Password Manager</h1>
      <p class="page-copy">
        Manage every saved site from a clean dashboard with fast editing, clear previews and a focused credential workflow.
      </p>
    </div>
    <a class="btn btn-primary" href="#site-form">Add site</a>
  </section>

  <div *ngIf="isSuccess" class="alert alert-success status-message">
    {{successMessage}}
  </div>

  <section id="site-form" class="site-editor panel-strong">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Site profile</p>
        <h2>{{formState}} Site</h2>
      </div>
      <span class="form-badge">Secure metadata</span>
    </div>

    <form #f="ngForm" (ngSubmit)="onSubmit(f.value)" class="form-grid site-form-grid">
      <label class="field">
        <span>Site name</span>
        <input [(ngModel)]="siteName" type="text" name="siteName" placeholder="Example Inc.">
      </label>

      <label class="field">
        <span>Site URL</span>
        <input [(ngModel)]="siteURL" type="text" name="siteURL" placeholder="https://example.com">
      </label>

      <label class="field wide-field">
        <span>Image URL</span>
        <input [(ngModel)]="siteImgURL" type="text" name="siteImgURL" placeholder="https://example.com/logo.png">
      </label>

      <div class="form-actions wide-field">
        <button class="btn btn-primary" type="submit">{{formState}} Site</button>
        <button class="btn btn-secondary" type="button" (click)="resetForm()">Cancel</button>
      </div>
    </form>
  </section>

  <section class="site-grid" aria-label="Saved sites">
    <article *ngFor="let site of allSites | async" class="site-card panel"
      [class.cover-image]="site.siteName?.toLowerCase().includes('godaddy') || site.siteName?.toLowerCase().includes('go daddy')">
      <button type="button" (click)="deleteSite(site.id)" class="card-delete" aria-label="Delete site" title="Delete site">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18" />
          <path d="M8 6V4h8v2" />
          <path d="M19 6l-1 14H6L5 6" />
          <path d="M10 11v5" />
          <path d="M14 11v5" />
        </svg>
      </button>

      <div class="site-image-wrap">
        <img [src]="site.siteImgURL" [alt]="site.siteName">
      </div>

      <div class="site-card-body">
        <h3>{{ site.siteName }}</h3>
        <span class="url-pill">{{site.siteURL}}</span>

        <div class="card-actions">
          <button type="button" routerLink="/password-list"
            [queryParams]="{id: site.id, siteName: site.siteName, siteURL: site.siteURL, siteImgURL: site.siteImgURL}"
            class="btn btn-primary">
            Passwords
          </button>

          <button type="button" (click)="editSite(site.siteName, site.siteURL, site.siteImgURL, site.id)"
            class="btn btn-secondary">
            Edit
          </button>
        </div>
      </div>
    </article>
  </section>
</main>
